name: mt5-probe
on:
  push:
    branches: [probe/mt5-runner]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install MetaTrader5
      - name: Broker installers, then a wrong-password login on each broker's server
        timeout-minutes: 20
        run: python probe/probe.py
