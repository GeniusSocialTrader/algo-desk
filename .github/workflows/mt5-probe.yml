name: mt5-probe
on:
  push:
    branches: [probe/mt5-runner]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install MetaTrader5 package
        run: pip install MetaTrader5
      - name: Install MT5 terminal silently
        shell: pwsh
        run: |
          $t = Get-Date
          Invoke-WebRequest https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe -OutFile mt5setup.exe
          $p = Start-Process .\mt5setup.exe -ArgumentList '/auto' -PassThru
          $p | Wait-Process -Timeout 400 -ErrorAction SilentlyContinue
          "installer exited: $($p.HasExited)  seconds: $(((Get-Date)-$t).TotalSeconds)"
          Get-ChildItem 'C:\Program Files\MetaTrader 5' | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Get-Process | Where-Object { $_.Name -like '*terminal*' -or $_.Name -like '*mt5*' } | Select-Object Name, Id | Format-Table | Out-String | Write-Host
      - name: Start terminal and look at it
        shell: pwsh
        run: |
          Copy-Item 'C:\Program Files\MetaTrader 5' -Destination D:\mt5 -Recurse
          Start-Process D:\mt5\terminal64.exe -ArgumentList '/portable'
          Start-Sleep 60
          Get-Process terminal64 -ErrorAction SilentlyContinue | Select-Object Id, MainWindowTitle, Responding | Format-Table | Out-String | Write-Host
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save('D:\shot.png')
          Get-ChildItem D:\mt5\Logs, D:\mt5\logs -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Encoding Unicode -ErrorAction SilentlyContinue | Select-Object -Last 40 }
      - uses: actions/upload-artifact@v4
        with: { name: shot, path: 'D:\shot.png' }
      - name: Probe Python bridge and broker logins
        run: python probe/probe.py
      - name: Terminal log after Python
        if: always()
        shell: pwsh
        run: Get-ChildItem D:\mt5\Logs -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Encoding Unicode | Select-Object -Last 60 }
